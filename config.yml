# =============================================================================
#  CONFIG -- the only file you edit
# =============================================================================
#  Point it at your data, declare the experiments you want, run the pipeline.
#  Nothing here is specific to PBMC, to an organism, or to a number of datasets.
#
#  Paths are relative to this file's directory, or absolute.  Use absolute
#  paths when the data lives outside the repo (e.g. PACE scratch).
#
#  To try a different dataset: add it under `datasets`, reference it in an
#  experiment, run.  No code changes.
# =============================================================================

# ---------------------------------------------------------------- datasets ---
# Every dataset needs a PCA matrix (cells x N).  RNA datasets additionally need
# counts/barcodes/features, because the real RNA cells are stacked on top of the
# imputed ATAC cells in the matrix handed to GRNBoost2.  ATAC datasets need ONLY
# the PCA -- their expression is imputed, never read.
#
#   pca        matrix, cells x 50 typically.  Any cells x N works.
#   counts     matrix, CELLS x FEATURES, MatrixMarket.  Raw counts.
#   barcodes   one per line; row i of `counts` is cell i.
#   features   one per line; column j of `counts` is feature j.
#
# CHECK YOUR DATA: `python run.py --check` verifies the files exist AND that
# counts rows == PCA rows == barcodes, and counts columns == features.  Those
# four files must describe the same cells in the same order.

datasets:

  # --- the bundled PBMC demo files (optional; delete if you bring your own) ---
  rna3k:       {modality: rna,  dir: data/3k_rna}
  atac3k:      {modality: atac, dir: data/3k_atac}
  rna6k:       {modality: rna,  dir: data/6k_rna}
  atac6k:      {modality: atac, dir: data/6k_atac}
  rna10k:      {modality: rna,  dir: data/10k_rna}
  atac10k:     {modality: atac, dir: data/10k_atac}
  atac10k_ext: {modality: atac, dir: data/atac10k_ext}

  # --- bring your own: give all four paths explicitly ------------------------
  #
  #   my_rna:
  #     modality: rna
  #     pca:      /scratch/me/my_rna/pca_50.txt
  #     counts:   /scratch/me/my_rna/counts.mtx
  #     barcodes: /scratch/me/my_rna/barcodes.txt
  #     features: /scratch/me/my_rna/features.txt
  #
  #   my_atac:
  #     modality: atac
  #     pca:      /scratch/me/my_atac/pca_50.txt
  #
  # Or, if the four files sit together in one directory:
  #
  #   my_rna: {modality: rna, dir: /scratch/me/my_rna}

# ------------------------------------------------------------- experiments ---
# An experiment is ONE integration over `datasets`, plus one or more REFERENCE
# strategies.  A strategy answers: which real RNA expression gets propagated
# onto the ATAC cells?
#
#   datasets    everything that enters the integration (RNA and ATAC)
#   anchor      the dataset everything is aligned TO.  Must be RNA.
#   queries     the ATAC datasets to impute
#   references  one entry per strategy:
#                 {dataset: <rna_name>}   use that single RNA dataset
#                 {combine: all_rna}      combine EVERY RNA dataset in
#                                         `datasets` into one reference
#
# WITH N RNA DATASETS YOU GET N+1 STRATEGIES FOR FREE -- one combined, plus one
# per individual dataset.  Add a third RNA dataset to `datasets` and a third
# per-dataset strategy appears with no code change.

experiments:

  # Two RNA datasets + their ATAC -> 3 strategies (combined, 3k, 10k)
  ab:
    datasets:  [rna3k, atac3k, rna10k, atac10k]
    anchor:    rna3k
    queries:   [atac3k, atac10k]
    references:
      combined: {combine: all_rna}
      rna3k:    {dataset: rna3k}
      rna10k:   {dataset: rna10k}

  # One RNA dataset -> 1 strategy.  Simplest possible experiment.
  paired:
    datasets:  [rna10k, atac10k]
    anchor:    rna10k
    queries:   [atac10k]
    references:
      rna10k: {dataset: rna10k}

  # Unpaired: RNA and ATAC from different nuclei
  unpaired:
    datasets:  [rna10k, atac10k_ext]
    anchor:    rna10k
    queries:   [atac10k_ext]
    references:
      rna10k: {dataset: rna10k}

# ---------------------------------------------------------------- GRN --------
grn:
  # Regulators handed to GRNBoost2 as tf_names.  One TF per line.
  regulators: data/tf_only.txt
  # Candidate target genes.  One per line.  Only these are used as targets.
  targets:    data/trrust_tf.txt
  # Both must be gene names present in your `features` files.
  #
  # NOTE: GRNBoost2 fits ONE regression per COLUMN of the matrix it is given,
  # and the matrix is the union of regulators and targets.  Runtime therefore
  # scales with COLUMNS, not with targets.  For a quick smoke test:
  #     python run.py -e paired --only grn --max-columns 3

# ------------------------------------------------------ integration params ---
# Optional.  These are the defaults; override only if you need to.
#
# integration:
#   M_samples: 2000        # sampled pairs per Sinkhorn iteration
#   alpha: 0.75
#   S_iterations: 25
#   gw_epsilon: 1e-5
#   gw_reg: 0.001
#   s_shared_cells: null   # cells assumed shared across modalities.
#                          # default: the smallest dataset.  For paired multiome
#                          # data you usually want the FULL cell count.
#   gene_axis: union       # how RNA datasets from DIFFERENT reference builds
#                          # are put on one gene axis before being stacked.
#                          #   union      every gene seen anywhere; a dataset
#                          #              missing a gene contributes zeros
#                          #   intersect  only genes present in every dataset
#                          # Default union, matching SCEMENT's own
#                          # concat(..., merge='same').  Run compare_features.py
#                          # to see the overlap first.

# ------------------------------------------------------------ ground truth ---
# TF,TARGET edge-list CSVs for scoring.  Any file that is missing is skipped
# with a note; the pipeline runs fine without any ground truth.
ground_truth:
  PBMC-TRRUST: data/ground_truth/PBMC-TRRUST.csv
  PBMC-Blood:  data/ground_truth/PBMC-Blood.csv
